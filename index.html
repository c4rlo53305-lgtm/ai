<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 ReparaFoto AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{
            background:linear-gradient(135deg,#1e3a8a,#7c3aed,#ec4899);
            min-height:100vh;
            padding:20px;
        }
        .contenedor{max-width:500px;margin:0 auto;}
        .caja{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 40px rgba(0,0,0,0.3);
            text-align:center;
        }
        h1{color:#1e3a8a;font-size:28px;margin-bottom:10px;}
        p{color:#64748b;margin-bottom:25px;font-size:16px;}
        
        .subir{
            border:3px dashed #7c3aed;
            border-radius:15px;
            padding:40px 20px;
            cursor:pointer;
            margin-bottom:25px;
            transition:0.3s;
            display:block;
            width:100%;
        }
        .subir:hover{background:#f1f5f9;}
        .icono{font-size:50px;margin-bottom:10px;}
        
        .boton{
            display:block;
            width:100%;
            padding:16px;
            background:linear-gradient(90deg,#7c3aed,#ec4899);
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin-bottom:15px;
        }
        .boton:hover{transform:scale(1.02);}
        .boton:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
        
        .preview{width:100%;border-radius:12px;margin-bottom:15px;display:none;}
        .preview.mostrar{display:block;}
        
        .resultado{margin-top:20px;display:none;}
        .resultado.mostrar{display:block;}
        .resultado img{width:100%;border-radius:12px;margin-bottom:10px;}
        
        .cargando{display:none;margin:20px 0;}
        .cargando.mostrar{display:block;}
        .spinner{
            width:45px;height:45px;border:4px solid #ddd;
            border-top-color:#7c3aed;border-radius:50%;
            animation:girar 1s linear infinite;
            margin:0 auto 15px;
        }
        @keyframes girar{to{transform:rotate(360deg);}}
        
        .aviso{
            background:#f0fdf4;border-left:4px solid #22c55e;
            padding:12px;border-radius:8px;
            font-size:13px;color:#166534;
            margin-bottom:20px;
        }
        
        .error{
            background:#fef2f2;border-left:4px solid #ef4444;
            padding:12px;border-radius:8px;
            font-size:13px;color:#991b1b;
            margin-top:15px;display:none;
        }
        .error.mostrar{display:block;}
        
        #archivo{display:none;}
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja">
            <h1>📸 ReparaFoto AI</h1>
            <p>Restaura tus fotos viejas y dañadas con IA</p>

            <div class="aviso">
                ✅ Toca la caja de abajo para abrir tu galería
            </div>

            <!-- Botón visible que abre la galería -->
            <label for="archivo" class="subir">
                <div class="icono">🖼️</div>
                <strong>Toca aquí para elegir tu foto</strong>
            </label>
            <input type="file" id="archivo" accept="image/*">
            
            <img id="vistaPrevia" class="preview" alt="Tu foto">

            <button class="boton" id="botonReparar" onclick="repararFoto()" disabled>✨ REPARAR FOTO</button>

            <div class="cargando" id="cargando">
                <div class="spinner"></div>
                <p>🔄 La IA está trabajando... espera unos segundos</p>
            </div>

            <div class="resultado" id="resultado">
                <h3>✅ ¡Tu foto está lista!</h3>
                <img id="imagenResultado" alt="Foto reparada">
                <a id="botonDescargar" class="boton" style="background:linear-gradient(90deg,#16a34a,#22c55e);text-decoration:none;" download="foto-reparada.png">💾 DESCARGAR FOTO</a>
                <button class="boton" style="background:linear-gradient(90deg,#6b7280,#4b5563);" onclick="location.reload()">🔄 Reparar otra</button>
            </div>

            <div class="error" id="cajaError"></div>
        </div>
    </div>

    <script>
        const HUGGINGFACE_KEY = "hf_MHFAK4m8qbEpO6FRk6RvtB8ZS3louo6T";
        const API_URL = "https://api-inference.huggingface.co/models/aspire/real-world-image-sr";
        
        let archivoImagen = null;
        const entradaArchivo = document.getElementById('archivo');
        const vistaPrevia = document.getElementById('vistaPrevia');
        const botonReparar = document.getElementById('botonReparar');

        entradaArchivo.addEventListener('change', function(e){
            if(e.target.files.length > 0){
                archivoImagen = e.target.files[0];
                const lector = new FileReader();
                lector.onload = function(datos){
                    vistaPrevia.src = datos.target.result;
                    vistaPrevia.classList.add('mostrar');
                    botonReparar.disabled = false;
                    document.getElementById('cajaError').classList.remove('mostrar');
                };
                lector.readAsArrayBuffer(archivoImagen);
            }
        });

        async function repararFoto(){
            if(!archivoImagen) return;
            
            botonReparar.disabled = true;
            document.getElementById('cargando').classList.add('mostrar');
            document.getElementById('resultado').classList.remove('mostrar');
            document.getElementById('cajaError').classList.remove('mostrar');

            try {
                const arrayBuffer = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsArrayBuffer(archivoImagen);
                });

                const respuesta = await fetch(API_URL, {
                    headers: {
                        Authorization: `Bearer ${HUGGINGFACE_KEY}`,
                        "Content-Type": "application/json",
                    },
                    method: "POST",
                    body: arrayBuffer
                });

                if(!respuesta.ok) throw new Error(`Error ${respuesta.status}. Intenta más tarde.`);

                const blob = await respuesta.blob();
                const url = URL.createObjectURL(blob);
                
                document.getElementById('imagenResultado').src = url;
                document.getElementById('botonDescargar').href = url;
                document.getElementById('resultado').classList.add('mostrar');

            } catch(error) {
                const cajaError = document.getElementById('cajaError');
                cajaError.textContent = "❌ " + error.message;
                cajaError.classList.add('mostrar');
            } finally {
                document.getElementById('cargando').classList.remove('mostrar');
                botonReparar.disabled = false;
            }
        }
    </script>
</body>
</html>
