<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100dvh;background:#000308;font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100dvh}
canvas.galaxy{display:block;position:fixed;inset:0;touch-action:none;z-index:1}
#editor{position:relative;z-index:10;max-width:540px;margin:0 auto;padding:28px 20px 120px}
.hero{text-align:center;margin-bottom:26px}
.hero h1{font-family:'Permanent Marker',cursive;font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.05;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#f107a3,#ff6b35,#00d4ff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 5s infinite;letter-spacing:1px;filter:drop-shadow(0 0 30px rgba(0,191,255,.4))}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero p{font-family:'Caveat',cursive;font-size:1.2rem;color:#87CEEB;margin-top:8px;text-shadow:0 0 14px rgba(0,191,255,.4)}
.card{background:linear-gradient(160deg,rgba(13,29,49,.9),rgba(12,13,19,.9));border:1px solid rgba(0,191,255,.25);border-radius:18px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label{font-size:.72rem;font-weight:600;color:#7f9dbf;text-transform:uppercase;letter-spacing:.8px}
.fld input,.fld textarea{background:rgba(0,0,0,.4);border:1px solid rgba(0,191,255,.2);border-radius:10px;padding:12px 14px;color:#e6f0ff;font-family:'Inter',sans-serif;font-size:16px;outline:none;width:100%}
.fld input:focus,.fld textarea:focus{border-color:#00d4ff;box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.fld textarea{min-height:88px;font-family:'Caveat',cursive;font-size:1.25rem;line-height:1.3;resize:vertical}
.file-drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1.5px dashed rgba(0,191,255,.4);border-radius:12px;cursor:pointer;transition:all .25s;background:rgba(0,191,255,.04);color:#7f9dbf;font-size:.9rem;text-align:center}
.file-drop:active{border-color:#00d4ff;background:rgba(0,212,255,.1);color:#a8d8ff}
.file-drop.has-file{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.1);color:#86efac}
#photo-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.photo-block{background:rgba(0,0,0,.3);border:1px solid rgba(0,191,255,.2);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.thumb{position:relative;width:76px;height:76px;flex-shrink:0;border-radius:9px;overflow:hidden;background:#000;border:1px solid rgba(0,191,255,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;border:1px solid rgba(255,255,255,.3);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meta .filename{font-size:.72rem;color:#7c93b0}
.meta textarea{background:rgba(0,0,0,.4);border:1px solid rgba(0,191,255,.18);border-radius:8px;padding:8px 10px;color:#e6f0ff;font-family:'Caveat',cursive;font-size:1.05rem;line-height:1.3;outline:none;resize:vertical;min-height:52px;width:100%}
#palette-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pal-btn{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.35);border:1.5px solid rgba(0,191,255,.15);cursor:pointer;color:#c8d8f0;font-size:.78rem;font-weight:500;font-family:inherit;text-align:left;transition:all .2s}
.pal-btn.active{border-color:#00d4ff;background:rgba(0,212,255,.14);color:#fff}
.pal-swatches{display:flex;gap:2px;flex-shrink:0}
.pal-swatch{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.btn{padding:14px 18px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:transform .15s,box-shadow .2s;margin-bottom:10px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;box-shadow:0 10px 30px rgba(0,212,255,.4)}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 10px 30px rgba(37,211,102,.4);display:none}
.btn-wa.show{display:flex}
.btn-copy{background:rgba(255,255,255,.08);color:#a8d8ff;border:1px solid rgba(0,191,255,.35);display:none}
.btn-copy.show{display:flex}
.result{display:none;margin-top:16px;padding:16px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.35);border-radius:12px;text-align:center}
.result.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.result .label{font-size:.72rem;color:#7f9dbf;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.result .url{font-family:monospace;font-size:.72rem;color:#87CEEB;word-break:break-all;background:rgba(0,0,0,.3);padding:10px;border-radius:8px;margin-bottom:12px;max-height:100px;overflow:auto}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:13px 24px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:1000;transition:transform .35s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#status.show{transform:translateX(-50%) translateY(0)}
#status.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:900;flex-direction:column;gap:14px;color:#87CEEB}
#loading.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(0,212,255,.2);border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#error-msg{display:none;padding:40px 20px;text-align:center;position:relative;z-index:10}
#error-msg h1{font-size:1.5rem;color:#ef4444;margin-bottom:12px}
#error-msg p{color:#87CEEB;margin-bottom:20px}
#error-msg a{color:#00d4ff;text-decoration:none;font-weight:600}
#galaxy{display:none;position:fixed;inset:0;z-index:5}
#galaxy.show{display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#0b1530 0%,#000308 70%);z-index:800;padding:24px;text-align:center;transition:opacity .6s}
#start.hidden{opacity:0;pointer-events:none;visibility:hidden}
#start-title{font-family:'Permanent Marker',cursive;font-size:clamp(2rem,8vw,4.2rem);line-height:1.05;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#f107a3,#ff6b35,#00d4ff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 5s infinite;letter-spacing:2px;filter:drop-shadow(0 0 30px rgba(0,191,255,.55));margin-bottom:16px;max-width:92vw;word-break:break-word}
#start-sub{font-family:'Caveat',cursive;font-size:clamp(1.1rem,3.6vw,1.6rem);color:#87CEEB;margin-bottom:38px;text-shadow:0 0 18px rgba(0,191,255,.5);max-width:88vw;line-height:1.35}
#start-btn{background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;border-radius:60px;padding:16px 44px;font-family:'Pacifico',cursive;font-size:clamp(1.05rem,3.8vw,1.35rem);color:#fff;cursor:pointer;box-shadow:0 0 40px rgba(0,212,255,.55),0 10px 30px rgba(0,0,0,.5);animation:pulse 2.4s infinite;touch-action:manipulation}

#modal{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top,14px)) 14px max(14px,env(safe-area-inset-bottom,14px));background:rgba(0,0,0,.82);backdrop-filter:blur(12px);display:none;justify-content:center;align-items:center;z-index:900;touch-action:none}
#modal.show{display:flex;animation:fadeIn .35s}

#modal-box{background:linear-gradient(135deg,rgba(13,29,49,.96),rgba(12,13,19,.96));border:1px solid rgba(0,191,255,.45);border-radius:22px;padding:clamp(24px,6vw,38px) clamp(18px,5vw,32px);width:100%;max-width:min(94vw,540px);max-height:100%;overflow-y:auto;text-align:center;position:relative;box-shadow:0 0 60px rgba(0,191,255,.35);animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}

#modal-desc{display:none;font-family:'Caveat',cursive;font-size:clamp(1.1rem,4vw,1.55rem);color:#ffd8a8;line-height:1.35;margin-bottom:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-style:italic}
#modal-desc.show{display:block}
#modal-msg{font-family:'Caveat',cursive;font-size:clamp(1.35rem,5.5vw,2.4rem);color:#a8d8ff;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
#modal-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(0,191,255,.4);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:10}

<div id="editor">

Cada estrella me recuerda a ti.</textarea>

      <button id="btn-copy" class="btn btn-copy">🔗 Copiar link</button>

  </div>
</div>

<div id="error-msg">

<div id="galaxy">

  <div id="modal">
    <div id="modal-box">
      <button id="modal-close">×</button>
      <img id="modal-img" alt="Recuerdo">
      <div id="modal-desc"></div>
      <div id="modal-msg"></div>

  </div>
</div>

<div id="status"></div>
<div id="loading"><div class="spinner"></div><div>Creando tu galaxia...</div></div>

async function addPhotos(files){
  var list = Array.from(files).filter(function(f){ return f.type.indexOf("image/") === 0; });
  if (!list.length) return;
  var slots = MAX_PHOTOS - editorState.photos.length;
  if (slots <= 0){ showStatus("Máximo " + MAX_PHOTOS + " fotos", false); return; }
  for (var i = 0; i < list.length && i < slots; i++){
    var file = list[i];
    var url = await new Promise(function(res){
      var rd = new FileReader();
      rd.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var maxW = 350;
          var s = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * s), h = Math.round(img.height * s);
          var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          res(cv.toDataURL("image/jpeg", 0.6));
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    });
    editorState.photos.push({ url: url, desc: "" });
  }
  renderPhotoList();
}

function renderPalettes(){
  var grid = $("palette-grid");
  if (!grid) return;
  grid.innerHTML = "";
  Object.keys(PALETTES).forEach(function(key){
    var pal = PALETTES[key];
    var b = document.createElement("button"); b.type = "button";
    b.className = "pal-btn" + (key === editorState.palette ? " active" : "");

      sw.appendChild(s);
    });

    b.appendChild(sw); b.appendChild(t);
    b.onclick = function(){ editorState.palette = key; renderPalettes(); };
    grid.appendChild(b);
  });
}

async function generate(){
  editorState.name = $("i-name").value.trim() || "Dedicatoria";
  editorState.subtitle = $("i-sub").value.trim();
  editorState.message = $("i-msg").value;

  if (editorState.photos.length === 0){ showStatus("Añade al menos una foto", false); return; }

  showLoading(true);
  try {
    var payload = {
      name: editorState.name,
      subtitle: editorState.subtitle,
      message: editorState.message,
      photos: editorState.photos,
      palette: editorState.palette
    };
    var jsonStr = JSON.stringify(payload);
    var sizeKB = (jsonStr.length/1024).toFixed(1);
    console.log("Tamaño JSON:", sizeKB, "KB");
    if (jsonStr.length > 95 * 1024){
      throw new Error("Contenido muy pesado (" + sizeKB + " KB). Reduce fotos.");
    }

    var resp = await fetch("https://api.jsonbin.io/v3/b", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": JSONBIN_ACCESS_KEY,
        "X-Bin-Name": "dedicatoria-" + Date.now(),
        "X-Bin-Private": "false"
      },
      body: jsonStr
    });

    if (!resp.ok){
      var errTxt = await resp.text();
      console.error("JsonBin:", resp.status, errTxt);
      throw new Error("Error " + resp.status + ": " + errTxt.slice(0, 150));
    }

    var result = await resp.json();
    var binId = result.metadata.id;
    console.log("Bin ID:", binId);

    var base = "https://" + GITHUB_USER + ".github.io/" + GITHUB_REPO + "/";
    var link = base + "?id=" + binId;

    $("result-url").textContent = link;
    $("result").classList.add("show");
    $("btn-wa").classList.add("show");
    $("btn-copy").classList.add("show");

    var waMsg = encodeURIComponent("💫 Te hice una galaxia de amor, ábrela aquí:\n" + link);
    $("btn-wa").onclick = function(){ window.open("https://wa.me/?text=" + waMsg, "_blank"); };
    $("btn-copy").onclick = async function(){
      try { await navigator.clipboard.writeText(link); showStatus("Link copiado ✓"); }
      catch(e){ showStatus("No se pudo copiar", false); }
    };

    $("result").scrollIntoView({ behavior: "smooth", block: "center" });
    showStatus("¡Link generado!");
  } catch(err){
    console.error(err);
    showStatus(err.message || "Error al guardar", false);
  } finally {
    showLoading(false);
  }
}

function initEditor(){
  $("i-photo").addEventListener("change", function(e){ addPhotos(e.target.files); e.target.value = ""; });
  $("btn-generate").addEventListener("click", generate);

  var drop = $("file-drop");

}

function easeInOutCubic(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function buildBg(){
  var C = G.BG_COUNT;
  var pos = new Float32Array(C*3), col = new Float32Array(C*3);
  var sz = new Float32Array(C), ph = new Float32Array(C);
  var color = new THREE.Color();
  for (var i=0;i<C;i++){
    var r = 400 + Math.random()*1400;
    var t1 = Math.random()*Math.PI*2;
    var t2 = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(t2)*Math.cos(t1);
    pos[i*3+1] = r*Math.cos(t2);
    pos[i*3+2] = r*Math.sin(t2)*Math.sin(t1);
    var t = Math.random();
    if (t<0.55) color.setHSL(0.58,0.15,0.95);
    else if (t<0.80) color.setHSL(0.10,0.35,0.92);
    else if (t<0.93) color.setHSL(0.05,0.65,0.80);
    else color.setHSL(0.60,0.65,0.85);
    col[i*3]=color.r; col[i*3+1]=color.g; col[i*3+2]=color.b;
    sz[i]=0.6+Math.random()*2.0; ph[i]=Math.random();
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  g.setAttribute("aColor",   new THREE.BufferAttribute(col,3));
  g.setAttribute("aSize",    new THREE.BufferAttribute(sz,1));
  g.setAttribute("aPhase",   new THREE.BufferAttribute(ph,1));
  var m = new THREE.ShaderMaterial({
    uniforms: G.uBg, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: "attribute float aSize;attribute float aPhase;attribute vec3 aColor;uniform float uTime;uniform float uPixelRatio;varying vec3 vColor;varying float vAlpha;void main(){vColor=aColor;float tw=0.5+0.35*sin(uTime*1.6+aPhase*6.2831);vAlpha=tw*0.75;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uPixelRatio*(280.0/-mv.z);gl_Position=projectionMatrix*mv;}",
    fragmentShader: "varying vec3 vColor;varying float vAlpha;void main(){vec2 uv=gl_PointCoord-vec2(0.5);float d=length(uv);if(d>0.5)discard;float a=pow(smoothstep(0.5,0.0,d),1.8)*vAlpha;gl_FragColor=vec4(vColor,a);}"
  });
  G.bgStars = new THREE.Points(g, m);
  G.scene.add(G.bgStars);
}

function buildGalaxy(){
  var pal = PALETTES[G.palette] || PALETTES.cosmic;
  var C = G.GALAXY_COUNT, ARMS = 4, R = 12, SPIN = 1.15;
  var pos = new Float32Array(C*3), col = new Float32Array(C*3);
  var sz = new Float32Array(C), ph = new Float32Array(C);
  var cs = pal.colors.map(function(h){ return new THREE.Color(h); });
  var cCore=cs[0], cIn=cs[1]||cs[0], cMid=cs[2]||cs[1], cOut=cs[3]||cs[2], cEdge=cs[4]||cs[3];
  var tmp = new THREE.Color();
  function gauss(){ var u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  for (var i=0;i<C;i++){
    var i3 = i*3;
    var radius = Math.pow(Math.random(),0.75)*R;
    var armAngle = ((i%ARMS)/ARMS)*Math.PI*2;
    var spinAngle = radius*SPIN;
    var spread = 0.35 + radius*0.06;
    var rX = gauss()*spread*radius*0.45;
    var rY = gauss()*spread*radius*0.10;
    var rZ = gauss()*spread*radius*0.45;
    var angle = armAngle + spinAngle;
    pos[i3]   = Math.cos(angle)*radius + rX;
    pos[i3+1] = rY + (Math.random()-0.5)*0.15;
    pos[i3+2] = Math.sin(angle)*radius + rZ;
    var t = Math.min(radius/R, 1);
    if (t<0.15) tmp.copy(cCore).lerp(cIn, t/0.15);
    else if (t<0.45) tmp.copy(cIn).lerp(cMid, (t-0.15)/0.30);
    else if (t<0.78) tmp.copy(cMid).lerp(cOut, (t-0.45)/0.33);
    else tmp.copy(cOut).lerp(cEdge, (t-0.78)/0.22);
    var b = 0.7 + Math.random()*0.4;
    col[i3]   = Math.min(tmp.r*b, 1);
    col[i3+1] = Math.min(tmp.g*b, 1);
    col[i3+2] = Math.min(tmp.b*b, 1);
    sz[i] = (0.5+Math.random()*1.5)*(1.0-t*0.35);
    ph[i] = Math.random();
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  g.setAttribute("aColor",   new THREE.BufferAttribute(col,3));
  g.setAttribute("aSize",    new THREE.BufferAttribute(sz,1));
  g.setAttribute("aPhase",   new THREE.BufferAttribute(ph,1));
  var m = new THREE.ShaderMaterial({
    uniforms: G.uGal, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader: "attribute float aSize;attribute float aPhase;attribute vec3 aColor;uniform float uTime;uniform float uPixelRatio;varying vec3 vColor;varying float vAlpha;void main(){vColor=aColor;float fl=0.8+0.15*sin(uTime*1.0+aPhase*6.2831);vAlpha=fl*0.72;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uPixelRatio*(200.0/-mv.z);gl_Position=projectionMatrix*mv;}",
    fragmentShader: "varying vec3 vColor;varying float vAlpha;void main(){vec2 uv=gl_PointCoord-vec2(0.5);float d=length(uv);if(d>0.5)discard;float core=smoothstep(0.5,0.0,d);float halo=pow(core,2.4);float a=(core*0.5+halo*0.85)*vAlpha;gl_FragColor=vec4(vColor,a);}"
  });
  G.galaxy = new THREE.Points(g, m);
  G.galaxy.rotation.x = G.rotation.x;
  G.worldGroup.add(G.galaxy);
}

function buildGlow(){
  var pal = PALETTES[G.palette] || PALETTES.cosmic;
  var c0 = new THREE.Color(pal.colors[0]);
  var c1 = new THREE.Color(pal.colors[1]||pal.colors[0]);
  var c2 = new THREE.Color(pal.colors[2]||pal.colors[0]);
  var S = 512;
  var cv = document.createElement("canvas"); cv.width = cv.height = S;
  var ctx = cv.getContext("2d");
  var g = ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  var toRGBA = function(c,a){ return "rgba("+Math.round(c.r*255)+","+Math.round(c.g*255)+","+Math.round(c.b*255)+","+a+")"; };
  g.addColorStop(0, toRGBA(c0, 0.7));
  g.addColorStop(0.18, toRGBA(c1, 0.45));
  g.addColorStop(0.4, toRGBA(c2, 0.2));
  g.addColorStop(0.7, "rgba(80,40,180,0.06)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
  var tex = new THREE.CanvasTexture(cv);
  if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
  G.glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity: 0.6 }));
  G.glow.scale.set(14,14,1);
  G.worldGroup.add(G.glow);
}

function makeStreak(){
  if (G.streakTex) return G.streakTex;
  var w = 256, h = 32;
  var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  var ctx = cv.getContext("2d");
  for (var x=0;x<w;x++){
    var tx = x/w, ba = Math.pow(tx, 2.4);
    for (var y=0;y<h;y++){
      var dy = Math.abs(y-h/2)/(h/2);
      var a = ba * Math.pow(1-dy, 2.2) * 0.95;
      if (a > 0.005){ ctx.fillStyle = "rgba(210,235,255,"+a+")"; ctx.fillRect(x,y,1,1); }
    }
  }
  var head = ctx.createRadialGradient(w-14, h/2, 0, w-14, h/2, 14);
  head.addColorStop(0, "rgba(255,255,255,1)");
  head.addColorStop(0.4, "rgba(200,230,255,0.7)");
  head.addColorStop(1, "rgba(160,200,255,0)");
  ctx.fillStyle = head; ctx.fillRect(w-32, 0, 32, h);
  var tex = new THREE.CanvasTexture(cv);
  if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
  G.streakTex = tex;
  return tex;
}

function buildShootingStars(){
  var st = makeStreak();
  var count = G.isMobile ? 3 : 5;
  for (var i=0;i<count;i++){
    var mat = new THREE.SpriteMaterial({ map: st, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending, opacity: 0 });
    var s = new THREE.Sprite(mat);
    s.scale.set(0.9,0.9,1); s.visible = false;
    G.scene.add(s);
    G.shootingStars.push({ sprite:s, active:false, t:0, dur:0, delay: 2+Math.random()*6, vx:0,vy:0,vz:0, startPos:new THREE.Vector3() });
  }
}

function updateShootingStars(dt){
  for (var k=0;k<G.shootingStars.length;k++){
    var ss = G.shootingStars[k];
    if (!ss.active){
      ss.delay -= dt;
      if (ss.delay <= 0){
        ss.active = true; ss.t = 0;
        ss.dur = 1.4 + Math.random()*0.9;
        var side = Math.random()<0.5?-1:1;
        var y = 6 + (Math.random()-0.5)*14;
        var z = -20 + Math.random()*30;
        ss.startPos.set(side*34, y, z);
        ss.vx = -side*(32+Math.random()*18);
        ss.vy = -(6+Math.random()*8);
        ss.vz = (Math.random()-0.5)*6;
        ss.sprite.position.copy(ss.startPos);
        ss.sprite.material.opacity = 0;
        ss.sprite.visible = true;
        var sz = 0.8 + Math.random()*0.6;
        ss.sprite.scale.set(sz*4.5, sz, 1);
      }
    } else {
      ss.t += dt;
      var p = ss.t / ss.dur;
      if (p >= 1){
        ss.active = false; ss.sprite.visible = false;
        ss.delay = 3 + Math.random()*7;
        continue;
      }
      ss.sprite.position.x = ss.startPos.x + ss.vx*ss.t;
      ss.sprite.position.y = ss.startPos.y + ss.vy*ss.t;
      ss.sprite.position.z = ss.startPos.z + ss.vz*ss.t;
      var op = 1;
      if (p<0.15) op = p/0.15;
      else if (p>0.75) op = (1-p)/0.25;
      ss.sprite.material.opacity = Math.max(0, Math.min(1, op));
      var p1 = new THREE.Vector3().copy(ss.sprite.position).project(G.camera);
      var p2 = new THREE.Vector3(
        ss.sprite.position.x + ss.vx*0.05,
        ss.sprite.position.y + ss.vy*0.05,
        ss.sprite.position.z + ss.vz*0.05
      ).project(G.camera);
      ss.sprite.material.rotation = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    }
  }
}

function makePhotoTex(dataURL){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var S = 512;
      var cv = document.createElement("canvas"); cv.width = cv.height = S;
      var ctx = cv.getContext("2d");
      var glow = ctx.createRadialGradient(S/2,S/2,S*0.32,S/2,S/2,S*0.5);
      glow.addColorStop(0,"rgba(80,200,255,0.42)");
      glow.addColorStop(1,"rgba(80,200,255,0)");
      ctx.fillStyle = glow; ctx.fillRect(0,0,S,S);
      var pad = 40, inner = S-pad*2, r = 26;
      var bg = ctx.createLinearGradient(pad,pad,S-pad,S-pad);
      bg.addColorStop(0,"#0a1525"); bg.addColorStop(1,"#050a15");
      ctx.save();
      roundedRect(ctx, pad, pad, inner, inner, r);
      ctx.fillStyle = bg; ctx.fill(); ctx.clip();
      var scale = Math.max(inner/img.width, inner/img.height);
      var dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, pad+(inner-dw)/2, pad+(inner-dh)/2, dw, dh);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "rgba(120,220,255,0.9)";
      ctx.lineWidth = 4;
      ctx.shadowColor = "rgba(0,200,255,0.8)";
      ctx.shadowBlur = 12;
      roundedRect(ctx, pad, pad, inner, inner, r); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1.5;
      roundedRect(ctx, pad+6, pad+6, inner-12, inner-12, r-6); ctx.stroke();
      ctx.restore();
      var tex = new THREE.CanvasTexture(cv);
      if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 4;
      resolve(tex);
    };
    img.onerror = function(){ resolve(null); };
    img.src = dataURL;
  });
}

async function buildSprites(){
  for (var i=0;i<G.photos.length;i++){
    var photo = G.photos[i];
    var tex = await makePhotoTex(photo.url);
    if (!tex) continue;
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    var sprite = new THREE.Sprite(mat);
    var golden = Math.PI*(3-Math.sqrt(5));
    var angle = i*golden + 0.7;
    var radius = 6.5 + (i%3)*2.6 + Math.random()*1.5;
    var y = Math.sin(i*1.9)*4.5 + (Math.random()-0.5)*1.5;
    sprite.position.set(Math.cos(angle)*radius, y, Math.sin(angle)*radius);
    var base = 2.0 + Math.random()*0.5;
    sprite.scale.set(base, base, 1);
    sprite.userData = { baseY: y, phase: Math.random()*Math.PI*2, baseScale: base, url: photo.url, desc: photo.desc||"" };
    G.spriteContainer.add(sprite);
    G.photoSprites.push(sprite);
  }
}

function makePhraseTex(text, color, variant){
  var canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
  var fonts = [
    "italic 600 70px 'Caveat', cursive",
    "600 62px 'Dancing Script', cursive",
    "italic 500 74px 'Caveat', cursive",
    "700 58px 'Dancing Script', cursive"
  ];
  var fontSize = [70,62,74,58][variant%4];
  var font = fonts[variant%4];
  var padX = 60, padY = 50;
  ctx.font = font;
  var m = ctx.measureText(text);
  var w = Math.ceil(m.width + padX*2);
  var h = fontSize + padY*2;
  canvas.width = w; canvas.height = h;
  ctx.font = font;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = color; ctx.shadowBlur = 28; ctx.fillStyle = color;
  ctx.fillText(text, w/2, h/2); ctx.fillText(text, w/2, h/2);
  ctx.shadowBlur = 12; ctx.fillStyle = color; ctx.fillText(text, w/2, h/2);
  ctx.shadowBlur = 3; ctx.fillStyle = "#ffffff"; ctx.fillText(text, w/2, h/2);
  var tex = new THREE.CanvasTexture(canvas);
  if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 2;
  return { tex: tex, aspect: w/h };
}

function buildPhrases(){
  var palette = ["#a8d8ff","#ffb6d9","#ffd8a8","#c8a8ff","#a8ffd4","#ffe8a8","#ff9ec4","#8ab4ff"];
  for (var i=0;i<200;i++){
    var text = LOVE_PHRASES[i % LOVE_PHRASES.length];
    var color = palette[i % palette.length];
    var r = makePhraseTex(text, color, i);
    var mat = new THREE.SpriteMaterial({
      map: r.tex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0.82
    });
    var sprite = new THREE.Sprite(mat);
    var golden = Math.PI*(3-Math.sqrt(5));
    var angle = i*golden;
    var radius = 3 + Math.pow(Math.random(), 0.6) * 18;
    var y = (Math.sin(i*0.7) + (Math.random()-0.5))*7;
    sprite.position.set(Math.cos(angle)*radius, y, Math.sin(angle)*radius);
    var scale = 0.9 + Math.random()*0.5;
    sprite.scale.set(scale*r.aspect, scale, 1);
    sprite.userData = { baseY: y, phase: Math.random()*Math.PI*2, floatSpeed: 0.3+Math.random()*0.6 };
    G.spriteContainer.add(sprite);
    G.phraseSprites.push(sprite);
  }
}

function onResize(){
  if (!G.renderer) return;
  G.camera.aspect = innerWidth/innerHeight;
  G.camera.updateProjectionMatrix();
  G.renderer.setSize(innerWidth, innerHeight);
  if (G.composer) G.composer.setSize(innerWidth, innerHeight);
  if (G.bloom) G.bloom.setSize(innerWidth, innerHeight);
  G.uBg.uPixelRatio.value = Math.min(devicePixelRatio, G.isMobile?1.5:2);
  G.uGal.uPixelRatio.value = Math.min(devicePixelRatio, G.isMobile?1.5:2);
}

function onDown(e){
  var cv = G.renderer.domElement;
  if (cv.setPointerCapture){ try { cv.setPointerCapture(e.pointerId); } catch(_){} }
  G.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  G.pointersCount++;
  G.rotationVel.x = 0; G.rotationVel.y = 0;
  if (G.pointersCount === 2) G.lastPinchDist = null;
  if (G.pointersCount === 1) G.tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
  else G.tapStart = null;
  e.preventDefault();
}
function onMove(e){
  G.lastPtr.x = e.clientX; G.lastPtr.y = e.clientY;
  var p = G.pointers[e.pointerId];
  if (!p) return;
  var prevX = p.x, prevY = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (G.pointersCount === 1){
    var dx = p.x - prevX, dy = p.y - prevY;
    G.rotation.y += dx*0.006;
    G.rotation.x += dy*0.006;
    G.rotation.x = Math.max(-ROT_LIMIT_X, Math.min(ROT_LIMIT_X, G.rotation.x));
    G.rotationVel.x = dy*0.006; G.rotationVel.y = dx*0.006;
    if (G.tapStart){
      var tdx = p.x - G.tapStart.x, tdy = p.y - G.tapStart.y;
      if (tdx*tdx + tdy*tdy > 100) G.tapStart = null;
    }
  } else if (G.pointersCount >= 2){
    var keys = Object.keys(G.pointers);
    var p1 = G.pointers[keys[0]], p2 = G.pointers[keys[1]];
    var ddx = p2.x - p1.x, ddy = p2.y - p1.y;
    var dist = Math.sqrt(ddx*ddx + ddy*ddy);
    if (G.lastPinchDist !== null){
      G.targetZoom += (G.lastPinchDist - dist)*0.07;
      G.targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, G.targetZoom));
    }
    G.lastPinchDist = dist;
    G.tapStart = null;
  }
  e.preventDefault();
}
function onUp(e){
  var cv = G.renderer.domElement;
  if (cv.releasePointerCapture){ try { cv.releasePointerCapture(e.pointerId); } catch(_){} }
  if (G.pointersCount === 1 && G.tapStart){
    var dt = performance.now() - G.tapStart.t;
    var dx = e.clientX - G.tapStart.x, dy = e.clientY - G.tapStart.y;
    if (dt < 400 && Math.sqrt(dx*dx+dy*dy) < 12) tryPhotoClick(e.clientX, e.clientY);
    G.tapStart = null;
  }
  delete G.pointers[e.pointerId];
  G.pointersCount = Math.max(0, G.pointersCount - 1);
  if (G.pointersCount < 2) G.lastPinchDist = null;
  if (G.pointersCount === 0) G.tapStart = null;
  e.preventDefault();
}
function onWheel(e){
  e.preventDefault();
  G.targetZoom += e.deltaY*0.02;
  G.targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, G.targetZoom));
}
function tryPhotoClick(cx, cy){
  if (!G.photoSprites.length) return;
  G.tmpNdc.x = (cx/innerWidth)*2 - 1;
  G.tmpNdc.y = -(cy/innerHeight)*2 + 1;
  G.raycaster.setFromCamera(G.tmpNdc, G.camera);
  G.raycaster.params.Sprite = { threshold: 0.3 };
  var hits = G.raycaster.intersectObjects(G.photoSprites);
  if (hits.length) zoomToPhoto(hits[0].object);
}
function zoomToPhoto(sprite){
  if (G.zoomState) return;
  var wp = sprite.position.clone().applyMatrix4(G.spriteContainer.matrixWorld);
  var dir = G.camera.position.clone().sub(wp).normalize();
  var dist = (sprite.userData.baseScale || 2) * 1.7;
  G.zoomState = {
    camA: G.camera.position.clone(),
    camB: wp.clone().add(dir.multiplyScalar(dist)),
    lookA: new THREE.Vector3(0,0,0),
    lookB: wp.clone(),
    t0: performance.now(),
    dur: G.isMobile ? 1150 : 1350,
    onDone: function(){
      $("modal-img").src = sprite.userData.url;
      var d = (sprite.userData.desc || "").trim();
      if (d){ $("modal-desc").textContent = d; $("modal-desc").classList.add("show"); }
      else { $("modal-desc").textContent = ""; $("modal-desc").classList.remove("show"); }
      $("modal-msg").textContent = G.message;
      $("modal").classList.add("show");
    }
  };
}
function zoomOutFromModal(){
  if (G.zoomState) return;
  G.zoomState = {
    camA: G.camera.position.clone(),
    camB: new THREE.Vector3(0, 6, G.targetZoom),
    lookA: new THREE.Vector3(0,0,0),
    lookB: new THREE.Vector3(0,0,0),
    t0: performance.now(),
    dur: G.isMobile ? 900 : 1100
  };
}

function animate(){
  requestAnimationFrame(animate);
  if (!G.renderer || !G.composer) return;
  var t = G.clock.getElapsedTime();
  var dt = Math.min(0.05, t - G.lastFrame);
  G.lastFrame = t;
  G.uBg.uTime.value = t;
  G.uGal.uTime.value = t;

  if (G.zoomState){
    var p = Math.min((performance.now() - G.zoomState.t0) / G.zoomState.dur, 1);
    var e = easeInOutCubic(p);
    G.camera.position.lerpVectors(G.zoomState.camA, G.zoomState.camB, e);
    var lx = G.zoomState.lookA.x + (G.zoomState.lookB.x - G.zoomState.lookA.x)*e;
    var ly = G.zoomState.lookA.y + (G.zoomState.lookB.y - G.zoomState.lookA.y)*e;
    var lz = G.zoomState.lookA.z + (G.zoomState.lookB.z - G.zoomState.lookA.z)*e;
    G.camera.lookAt(lx, ly, lz);
    if (p >= 1){ var done = G.zoomState; G.zoomState = null; if (done.onDone) done.onDone(); }
  } else {
    if (G.pointersCount === 0){
      G.rotation.x += G.rotationVel.x;
      G.rotation.y += G.rotationVel.y + AUTO_ROT;
      G.rotationVel.x *= 0.94; G.rotationVel.y *= 0.94;
      G.rotation.x = Math.max(-ROT_LIMIT_X, Math.min(ROT_LIMIT_X, G.rotation.x));
      if (Math.abs(G.rotationVel.x) < 0.0001) G.rotationVel.x = 0;
      if (Math.abs(G.rotationVel.y) < 0.0001) G.rotationVel.y = 0;
    } else {
      G.rotation.y += AUTO_ROT*0.5;
    }
    G.currentZoom += (G.targetZoom - G.currentZoom)*0.12;
    if (G.worldGroup){
      G.worldGroup.rotation.x = G.rotation.x;
      G.worldGroup.rotation.y = G.rotation.y;
    }
    if (G.bgStars){
      G.bgStars.rotation.y = -G.rotation.y*0.1 - t*0.004;
      G.bgStars.rotation.x = G.rotation.x*0.06;
    }
    G.camera.position.set(0, 6, G.currentZoom);
    G.camera.lookAt(0, 0, 0);
  }

  for (var i=0;i<G.photoSprites.length;i++){
    var s = G.photoSprites[i];
    if (s.userData.baseY !== undefined) s.position.y = s.userData.baseY + Math.sin(t*0.8 + s.userData.phase)*0.35;
  }
  for (var j=0;j<G.phraseSprites.length;j++){
    var s2 = G.phraseSprites[j];
    if (s2.userData.baseY !== undefined) s2.position.y = s2.userData.baseY + Math.sin(t*s2.userData.floatSpeed + s2.userData.phase)*0.5;
  }

  updateShootingStars(dt);

  if (!G.isMobile && G.photoSprites.length && G.isStarted && !G.zoomState){
    G.tmpNdc.x = (G.lastPtr.x/innerWidth)*2 - 1;
    G.tmpNdc.y = -(G.lastPtr.y/innerHeight)*2 + 1;
    G.raycaster.setFromCamera(G.tmpNdc, G.camera);
    G.raycaster.params.Sprite = { threshold: 0.2 };
    var hits = G.raycaster.intersectObjects(G.photoSprites);
    G.hoveredPhoto = hits.length ? hits[0].object : null;
    for (var k=0;k<G.photoSprites.length;k++){
      var s3 = G.photoSprites[k];
      var base = s3.userData.baseScale || 2;
      var tgt = s3 === G.hoveredPhoto ? base*1.18 : base;
      var nxt = s3.scale.x + (tgt - s3.scale.x)*0.15;
      s3.scale.set(nxt, nxt, 1);
    }
    G.renderer.domElement.style.cursor = G.hoveredPhoto ? "pointer" : "grab";
  }

  G.composer.render();
}

var startHandled = false;
function onStartClick(){
  if (startHandled) return;
  startHandled = true;
  setTimeout(function(){ startHandled = false; }, 800);
  $("start").classList.add("hidden");
  $("hint").classList.add("show");
  G.isStarted = true;
  setTimeout(function(){
    if (G.photos.length > 0){
      setTimeout(function(){
        var first = G.photos[0];
        $("modal-img").src = first.url;
        var d = (first.desc || "").trim();
        if (d){ $("modal-desc").textContent = d; $("modal-desc").classList.add("show"); }
        else { $("modal-desc").textContent = ""; $("modal-desc").classList.remove("show"); }
        $("modal-msg").textContent = G.message;
        $("modal").classList.add("show");
      }, 900);
    }
  }, 1500);
}

function initGalaxyEvents(){
  $("start-btn").addEventListener("pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    onStartClick();
  });
  $("start-btn").addEventListener("click", function(e){
    e.preventDefault();
    onStartClick();
  });
  function closeModal(){
    $("modal").classList.remove("show");
    if (G.isStarted) zoomOutFromModal();
  }
  $("modal-close").addEventListener("click", function(e){ e.stopPropagation(); closeModal(); });
  $("modal").addEventListener("click", function(e){ if (e.target === $("modal")) closeModal(); });
}

/* ============================================================
   CARGAR DEDICATORIA DESDE JSONBIN
   ============================================================ */
async function loadDedication(binId){
  var resp = await fetch("https://api.jsonbin.io/v3/b/" + binId + "/latest", {
    headers: { "X-Access-Key": JSONBIN_ACCESS_KEY }
  });
  if (!resp.ok) throw new Error("No se pudo cargar (HTTP " + resp.status + ")");
  var json = await resp.json();
  return json.record;
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener("DOMContentLoaded", async function(){
  var id = getParam("id");
  if (!id){
    $("editor").style.display = "block";
    $("galaxy").style.display = "none";
    initEditor();
    return;
  }
  $("editor").style.display = "none";
  $("galaxy").classList.add("show");
  showLoading(true);
  try {
    var data = await loadDedication(id);
    showLoading(false);
    initGalaxy(data);
    initGalaxyEvents();
  } catch(err){
    console.error(err);
    showLoading(false);
    $("galaxy").classList.remove("show");
    $("error-msg").style.display = "block";
  }
});
