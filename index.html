<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100dvh;background:radial-gradient(ellipse at top,#0b1530 0%,#000308 70%);font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden}
#editor{position:relative;z-index:10;max-width:540px;margin:0 auto;padding:28px 20px 120px}
.hero{text-align:center;margin-bottom:26px}
.hero h1{font-family:'Permanent Marker',cursive;font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.05;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#f107a3,#ff6b35,#00d4ff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 5s infinite;letter-spacing:1px;filter:drop-shadow(0 0 30px rgba(0,191,255,.4))}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero p{font-family:'Caveat',cursive;font-size:1.2rem;color:#87CEEB;margin-top:8px;text-shadow:0 0 14px rgba(0,191,255,.4)}
.card{background:linear-gradient(160deg,rgba(13,29,49,.9),rgba(12,13,19,.9));border:1px solid rgba(0,191,255,.25);border-radius:18px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label{font-size:.72rem;font-weight:600;color:#7f9dbf;text-transform:uppercase;letter-spacing:.8px}
.fld input,.fld textarea{background:rgba(0,0,0,.4);border:1px solid rgba(0,191,255,.2);border-radius:10px;padding:12px 14px;color:#e6f0ff;font-family:'Inter',sans-serif;font-size:16px;outline:none;width:100%}
.fld input:focus,.fld textarea:focus{border-color:#00d4ff;box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.fld textarea{min-height:88px;font-family:'Caveat',cursive;font-size:1.25rem;line-height:1.3;resize:vertical}
.file-drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1.5px dashed rgba(0,191,255,.4);border-radius:12px;cursor:pointer;transition:all .25s;background:rgba(0,191,255,.04);color:#7f9dbf;font-size:.9rem;text-align:center}
.file-drop:active{border-color:#00d4ff;background:rgba(0,212,255,.1);color:#a8d8ff}
.file-drop.has-file{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.1);color:#86efac}
#photo-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.photo-block{background:rgba(0,0,0,.3);border:1px solid rgba(0,191,255,.2);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.thumb{position:relative;width:76px;height:76px;flex-shrink:0;border-radius:9px;overflow:hidden;background:#000;border:1px solid rgba(0,191,255,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;border:1px solid rgba(255,255,255,.3);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meta .filename{font-size:.72rem;color:#7c93b0}
.meta textarea{background:rgba(0,0,0,.4);border:1px solid rgba(0,191,255,.18);border-radius:8px;padding:8px 10px;color:#e6f0ff;font-family:'Caveat',cursive;font-size:1.05rem;line-height:1.3;outline:none;resize:vertical;min-height:52px;width:100%}
#palette-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pal-btn{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.35);border:1.5px solid rgba(0,191,255,.15);cursor:pointer;color:#c8d8f0;font-size:.78rem;font-weight:500;font-family:inherit;text-align:left;transition:all .2s}
.pal-btn.active{border-color:#00d4ff;background:rgba(0,212,255,.14);color:#fff}
.pal-swatches{display:flex;gap:2px;flex-shrink:0}
.pal-swatch{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.btn{padding:14px 18px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:transform .15s,box-shadow .2s;margin-bottom:10px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 10px 30px rgba(34,197,94,.4)}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 10px 30px rgba(37,211,102,.4);display:none}
.btn-wa.show{display:flex}
.info{font-size:.75rem;color:#7f9dbf;text-align:center;margin-top:14px;line-height:1.5;background:rgba(0,191,255,.06);padding:10px;border-radius:10px}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:13px 24px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:1000;transition:transform .35s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#status.show{transform:translateX(-50%) translateY(0)}
#status.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:900;flex-direction:column;gap:14px;color:#87CEEB}
#loading.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(0,212,255,.2);border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

n|Corazón mío|Dueño de mi corazón|Dueña de mi corazón|Mi dueño|Mi dueña|Mi debilidad|Mi fortaleza|Mi refugio|Mi casa|Mi todo entero|Eres mi mundo|Mi mundo entero|Mi planetita|Mi persona especial|Mi persona favorita en el mundo|Mi favorito|Mi favorita|Mi consentido|Mi consentida|Mi niño|Mi niña|Mi bebé|Mi amor chiquito|Mi vida entera|Mi vida misma|Razón de mi existir|Me haces mejor persona|Me haces querer ser mejor|Por ti mejoro cada día|Eres mi inspiración|Mi musa|Mi inspiración diaria|Poeta por ti|Escribiría mil poemas por ti|Canciones para ti|Solo canto por ti|Compongo para ti|Eres mi canción favorita|Mi melodía|Mi sinfonía|Mi ritmo|Mi compás|El latido de mi corazón|El aire que respiro|Mi alimento del alma|Mi oxígeno|Sin ti me ahogo|Contigo respiro|Contigo todo tiene sentido|Contigo es todo bonito|Haces todo más bonito|Embelleces mi vida|Pintas de colores mi mundo|Pintas mi vida|Mi artista favorito|Me gusta cómo eres|Me encanta cómo eres|Eres increíble|Eres maravilloso|Eres maravillosa|Eres espectacular|Eres única|Eres único|No hay otra como tú|No hay otro como tú|Irrepetible|Inigualable|Perfecto para mí|Perfecta para mí|Tal como eres te amo|Te amo tal como eres|Con todos tus defectos te amo|Con todas tus virtudes te amo|Te amo con tus días malos|Amo hasta tus silencios|Amo tus abrazos|Amo tus besos|Amo tu voz|Amo tu risa|Amo tu sonrisa|Amo tu mirada|Amo tus manos|Amo tu forma de ser|Amo estar contigo|Amo tus locuras|Amo tus ocurrencias|Eres mi persona loca favorita|Mi compañero de aventuras|Mi compañera de vida|Compañero de sueños|Compañera eterna|Juntos somos uno|Los dos somos uno|Alma gemela|Mi alma gemela|Mi media naranja|La otra mitad de mí|Sin ti estoy incompleto|Sin ti estoy incompleta|Me complementas|Me completas|Me haces sentir completo|Me haces sentir en casa|Contigo estoy en casa|En tus brazos encuentro paz|En tus abrazos soy feliz|Entre tus brazos me quedo|Quiero envejecer contigo|Contigo hasta viejitos|Quiero toda una vida contigo|Toda la eternidad co var PALETTES = {

  rose:{name:"Rosa galaxia",emoji:"🌸",colors:["#fff0f5","#ff9ec4","#ff4f9a","#a823a8","#5a1a8a"]},
  gold:{name:"Dorado",emoji:"✨",colors:["#fffbe0","#ffe066","#ffb84d","#ff8c1a","#b85c00"]},
  aurora:{name:"Aurora",emoji:"🌿",colors:["#e0ffea","#a8ffd4","#4affb0","#1ab8d4","#0a6b9e"]},
  neon:{name:"Violeta neón",emoji:"💜",colors:["#ffe0ff","#d68eff","#a855f7","#6b2ff7","#3a1f8a"]},
  stardust:{name:"Blanco estelar",emoji:"🤍",colors:["#ffffff","#e8f0ff","#c0d8ff","#90b0ff","#5060c0"]}
};

var MAX_PHOTOS = 8;
var state = {
  name:"Mi amor", subtitle:"Una experiencia galáctica te espera",
  message:"Eres mi universo entero ✨\nCada estrella me recuerda a ti.",
  photos:[], palette:"cosmic"
};
var $ = function(id){ return document.getElementById(id); };

function showStatus(msg, ok){
  var s = $("status");
  s.textContent = msg;
  s.classList.toggle("err", ok === false);
  s.classList.add("show");
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(function(){ s.classList.remove("show"); }, 3400);
}
function showLoading(v){ $("loading").classList.toggle("show", !!v); }
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function slugify(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "galaxia";
}

function renderPhotoList(){
  var list = $("photo-list"); list.innerHTML = "";
  state.photos.forEach(function(p, i){
    var block = document.createElement("div"); block.className = "photo-block";
    var thumb = document.createElement("div"); thumb.className = "thumb";
    var im = document.createElement("img"); im.src = p.url; im.alt = "foto " + (i+1);
    var del = document.createElement("button"); del.textContent = "×"; del.type = "button";
    del.onclick = function(){ state.photos.splice(i,1); renderPhotoList(); };
    thumb.appendChild(im); thumb.appendChild(del);
    var meta = document.createElement("div"); meta.className = "meta";
    var n = document.createElement("div"); n.className = "filename"; n.textContent = "Foto #" + (i+1);
    var ta = document.createElement("textarea");
    ta.placeholder = "Descripción..."; ta.maxLength = 120; ta.value = p.desc || "";
    ta.addEventListener("input", function(){ p.desc = ta.value; });
    meta.appendChild(n); meta.appendChild(ta);
    block.appendChild(thumb); block.appendChild(meta);
    list.appendChild(block);
  });
  $("f-label").textContent = state.photos.length === 0
    ? "📷 Añadir fotos (máx. " + MAX_PHOTOS + ")"
    : "✓ " + state.photos.length + "/" + MAX_PHOTOS + " · añadir más";
  $("file-drop").classList.toggle("has-file", state.photos.length > 0);
}

async function addPhotos(files){
  var list = Array.from(files).filter(function(f){ return f.type.indexOf("image/") === 0; });
  if (!list.length) return;
  var slots = MAX_PHOTOS - state.photos.length;
  if (slots <= 0){ showStatus("Máximo " + MAX_PHOTOS + " fotos", false); return; }
  for (var i = 0; i < list.length && i < slots; i++){
    var file = list[i];
    var url = await new Promise(function(res){
      var rd = new FileReader();
      rd.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          // 800px calidad 78% → buena calidad sin que el HTML se vaya de las manos
          var maxW = 800;
          var s = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * s), h = Math.round(img.height * s);
          var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          res(cv.toDataURL("image/jpeg", 0.78));
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(file);
    });
    state.photos.push({ url: url, desc: "" });
  }
  renderPhotoList();
}

function renderPalettes(){
  var grid = $("palette-grid"); grid.innerHTML = "";
  Object.keys(PALETTES).forEach(function(key){
    var pal = PALETTES[key];
    var b = document.createElement("button"); b.type = "button";
    b.className = "pal-btn" + (key === state.palette ? " active" : "");
    var sw = document.createElement("div"); sw.className = "pal-swatches";
    pal.colors.forEach(function(c){
      var s = document.createElement("div"); s.className = "pal-swatch"; s.style.background = c;
      sw.appendChild(s);
    });
    var t = document.createElement("div"); t.textContent = pal.emoji + " " + pal.name; t.style.flex = "1";
    b.appendChild(sw); b.appendChild(t);
    b.onclick = function(){ state.palette = key; renderPalettes(); };
    grid.appendChild(b);
  });
}

'    var angle=i*golden+0.7,radius=6.5+(i%3)*2.6+Math.random()*1.5;\n' +
'    var y=Math.sin(i*1.9)*4.5+(Math.random()-0.5)*1.5;\n' +
'    sprite.position.set(Math.cos(angle)*radius,y,Math.sin(angle)*radius);\n' +
'    var base=2.0+Math.random()*0.5;\n' +
'    sprite.scale.set(base,base,1);\n' +
'    sprite.userData={baseY:y,phase:Math.random()*Math.PI*2,baseScale:base,url:photo.url,desc:photo.desc||""};\n' +
'    spriteContainer.add(sprite);photoSprites.push(sprite);\n' +
'  }\n' +
'}\n' +
'function makePhraseTex(text,color,variant){\n' +
'  var canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");\n' +
'  var fonts=["italic 600 70px \'Caveat\', cursive","600 62px \'Dancing Script\', cursive","italic 500 74px \'Caveat\', cursive","700 58px \'Dancing Script\', cursive"];\n' +
'  var fontSize=[70,62,74,58][variant%4],font=fonts[variant%4],padX=60,padY=50;\n' +
'  ctx.font=font;var m=ctx.measureText(text);\n' +
'  var w=Math.ceil(m.width+padX*2),h=fontSize+padY*2;\n' +
'  canvas.width=w;canvas.height=h;\n' +
'  ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";\n' +
'  ctx.shadowColor=color;ctx.shadowBlur=28;ctx.fillStyle=color;\n' +
'  ctx.fillText(text,w/2,h/2);ctx.fillText(text,w/2,h/2);\n' +
'  ctx.shadowBlur=12;ctx.fillStyle=color;ctx.fillText(text,w/2,h/2);\n' +
'  ctx.shadowBlur=3;ctx.fillStyle="#ffffff";ctx.fillText(text,w/2,h/2);\n' +
'  var tex=new THREE.CanvasTexture(canvas);\n' +
'  if(tex.encoding!==undefined)tex.encoding=THREE.sRGBEncoding;\n' +
'  tex.anisotropy=2;\n' +
'  return {tex:tex,aspect:w/h};\n' +
'}\n' +
'function buildPhrases(){\n' +
'  var palette=["#a8d8ff","#ffb6d9","#ffd8a8","#c8a8ff","#a8ffd4","#ffe8a8","#ff9ec4","#8ab4ff"];\n' +
'  for(var i=0;i<PHRASE_COUNT;i++){\n' +
'    var text=LOVE_PHRASES[i%LOVE_PHRASES.length];\n' +
'    var color=palette[i%palette.length];\n' +
'    var r=makePhraseTex(text,color,i);\n' +
'    var mat=new THREE.SpriteMaterial({map:r.tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.82});\n' +
'    var sprite=new THREE.Sprite(mat);\n' +
'    var golden=Math.PI*(3-Math.sqrt(5));\n' +
'    var angle=i*golden,radius=3+Math.pow(Math.random(),0.6)*18;\n' +
'    var y=(Math.sin(i*0.7)+(Math.random()-0.5))*7;\n' +
'    sprite.position.set(Math.cos(angle)*radius,y,Math.sin(angle)*radius);\n' +
'    var scale=0.9+Math.random()*0.5;\n' +
'    sprite.scale.set(scale*r.aspect,scale,1);\n' +
'    sprite.userData={baseY:y,phase:Math.random()*Math.PI*2,floatSpeed:0.3+Math.random()*0.6};\n' +
'    spriteContainer.add(sprite);phraseSprites.push(sprite);\n' +
'  }\n' +
'}\n' +
'function onResize(){\n' +
'  if(!renderer)return;\n' +
'  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();\n' +
'  renderer.setSize(innerWidth,innerHeight);\n' +
'  if(composer)composer.setSize(innerWidth,innerHeight);\n' +
'  if(bloomPass)bloomPass.setSize(innerWidth,innerHeight);\n' +
'  uBg.uPixelRatio.value=Math.min(devicePixelRatio,isMobile?1.5:2);\n' +
'  uGal.uPixelRatio.value=Math.min(devicePixelRatio,isMobile?1.5:2);\n' +
'}\n' +
'function onDown(e){\n' +
'  var cv=renderer.domElement;if(cv.setPointerCapture){try{cv.setPointerCapture(e.pointerId);}catch(_){}}\n' +
'  pointers[e.pointerId]={x:e.clientX,y:e.clientY};pointersCount++;\n' +
'  rotationVel.x=0;rotationVel.y=0;\n' +
'  if(pointersCount===2)lastPinchDist=null;\n' +
'  if(pointersCount===1)tapStart={x:e.clientX,y:e.clientY,t:performance.now()};else tapStart=null;\n' +
'  e.preventDefault();\n' +
'}\n' +
'function onMove(e){\n' +
'  lastPtr.x=e.clientX;lastPtr.y=e.clientY;\n' +
'  var p=pointers[e.pointerId];if(!p)return;\n' +
'  var prevX=p.x,prevY=p.y;p.x=e.clientX;p.y=e.clientY;\n' +
'  if(pointersCount===1){\n' +
'    var dx=p.x-prevX,dy=p.y-prevY;\n' +
'    rotation.y+=dx*0.006;rotation.x+=dy*0.006;\n' +
'    rotation.x=Math.max(-ROT_LIMIT_X,Math.min(ROT_LIMIT_X,rotation.x));\n' +
'    rotationVel.x=dy*0.006;rotationVel.y=dx*0.006;\n' +
'    if(tapStart){var tdx=p.x-tapStart.x,tdy=p.y-tapStart.y;if(tdx*tdx+tdy*tdy>100)tapStart=null;}\n' +
'  }else if(pointersCount>=2){\n' +
'    var keys=Object.keys(pointers);var p1=pointers[keys[0]],p2=pointers[keys[1]];\n' +
'    var ddx=p2.x-p1.x,ddy=p2.y-p1.y;var dist=Math.sqrt(ddx*ddx+ddy*ddy);\n' +
'    if(lastPinchDist!==null){targetZoom+=(lastPinchDist-dist)*0.07;targetZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,targetZoom));}\n' +
'    lastPinchDist=dist;tapStart=null;\n' +
'  }\n' +
'  e.preventDefault();\n' +
'}\n' +
'function onUp(e){\n' +
'  var cv=renderer.domElement;if(cv.releasePointerCapture){try{cv.releasePointerCapture(e.pointerId);}catch(_){}}\n' +
'  if(pointersCount===1&&tapStart){\n' +
'    var dt=performance.now()-tapStart.t,dx=e.clientX-tapStart.x,dy=e.clientY-tapStart.y;\n' +
'    if(dt<400&&Math.sqrt(dx*dx+dy*dy)<12)tryPhotoClick(e.clientX,e.clientY);\n' +
'    tapStart=null;\n' +
'  }\n' +
'  delete pointers[e.pointerId];pointersCount=Math.max(0,pointersCount-1);\n' +
'  if(pointersCount<2)lastPinchDist=null;\n' +
'  if(pointersCount===0)tapStart=null;\n' +
'  e.preventDefault();\n' +
'}\n' +
'function onWheel(e){e.preventDefault();targetZoom+=e.deltaY*0.02;targetZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,targetZoom));}\n' +
'function tryPhotoClick(cx,cy){\n' +
'  if(!photoSprites.length)return;\n' +
'  tmpNdc.x=(cx/innerWidth)*2-1;tmpNdc.y=-(cy/innerHeight)*2+1;\n' +
'  raycaster.setFromCamera(tmpNdc,camera);\n' +
'  raycaster.params.Sprite={threshold:0.3};\n' +
'  var hits=raycaster.intersectObjects(photoSprites);\n' +
'  if(hits.length)zoomToPhoto(hits[0].object);\n' +
'}\n' +
'function zoomToPhoto(sprite){\n' +
'  if(zoomState)return;\n' +
'  var wp=sprite.position.clone().applyMatrix4(spriteContainer.matrixWorld);\n' +
'  var dir=camera.position.clone().sub(wp).normalize();\n' +
'  var dist=(sprite.userData.baseScale||2)*1.7;\n' +
'  zoomState={camA:camera.position.clone(),camB:wp.clone().add(dir.multiplyScalar(dist)),\n' +
'    lookA:new THREE.Vector3(0,0,0),lookB:wp.clone(),t0:performance.now(),dur:isMobile?1150:1350,\n' +
'    onDone:function(){\n' +
'      el.modalImg.src=sprite.userData.url;\n' +
'      var d=(sprite.userData.desc||"").trim();\n' +
'      if(d){el.modalDesc.textContent=d;el.modalDesc.classList.add("show");}\n' +
'      else{el.modalDesc.textContent="";el.modalDesc.classList.remove("show");}\n' +
'      el.modalMsg.textContent=MESSAGE;\n' +
'      el.modal.classList.add("show");\n' +
'    }};\n' +
'}\n' +
'function zoomOutFn(){\n' +
'  if(zoomState)return;\n' +
'  zoomState={camA:camera.position.clone(),camB:new THREE.Vector3(0,6,targetZoom),\n' +
'    lookA:new THREE.Vector3(0,0,0),lookB:new THREE.Vector3(0,0,0),\n' +
'    t0:performance.now(),dur:isMobile?900:1100};\n' +
'}\n' +
'function animate(){\n' +
'  requestAnimationFrame(animate);\n' +
'  if(!renderer||!composer)return;\n' +
'  var t=clock.getElapsedTime();\n' +
'  var dt=Math.min(0.05,t-lastFrame);lastFrame=t;\n' +
'  uBg.uTime.value=t;uGal.uTime.value=t;\n' +
'  if(zoomState){\n' +
'    var p=Math.min((performance.now()-zoomState.t0)/zoomState.dur,1);\n' +
'    var e=easeInOutCubic(p);\n' +
'    camera.position.lerpVectors(zoomState.camA,zoomState.camB,e);\n' +
'    var lx=zoomState.lookA.x+(zoomState.lookB.x-zoomState.lookA.x)*e;\n' +
'    var ly=zoomState.lookA.y+(zoomState.lookB.y-zoomState.lookA.y)*e;\n' +
'    var lz=zoomState.lookA.z+(zoomState.lookB.z-zoomState.lookA.z)*e;\n' +
'    camera.lookAt(lx,ly,lz);\n' +
'    if(p>=1){var done=zoomState;zoomState=null;if(done.onDone)done.onDone();}\n' +
'  }else{\n' +
'    if(pointersCount===0){\n' +
'      rotation.x+=rotationVel.x;rotation.y+=rotationVel.y+AUTO_ROT;\n' +
'      rotationVel.x*=0.94;rotationVel.y*=0.94;\n' +
'      rotation.x=Math.max(-ROT_LIMIT_X,Math.min(ROT_LIMIT_X,rotation.x));\n' +
'      if(Math.abs(rotationVel.x)<0.0001)rotationVel.x=0;\n' +
'      if(Math.abs(rotationVel.y)<0.0001)rotationVel.y=0;\n' +
'    }else{rotation.y+=AUTO_ROT*0.5;}\n' +
'    currentZoom+=(targetZoom-currentZoom)*0.12;\n' +
'    if(worldGroup){worldGroup.rotation.x=rotation.x;worldGroup.rotation.y=rotation.y;}\n' +
'    if(bgStars){bgStars.rotation.y=-rotation.y*0.1-t*0.004;bgStars.rotation.x=rotation.x*0.06;}\n' +
'    camera.position.set(0,6,currentZoom);camera.lookAt(0,0,0);\n' +
'  }\n' +
'  for(var i=0;i<photoSprites.length;i++){var s=photoSprites[i];\n' +
'    if(s.userData.baseY!==undefined)s.position.y=s.userData.baseY+Math.sin(t*0.8+s.userData.phase)*0.35;}\n' +
'  for(var j=0;j<phraseSprites.length;j++){var s2=phraseSprites[j];\n' +
'    if(s2.userData.baseY!==undefined)s2.position.y=s2.userData.baseY+Math.sin(t*s2.userData.floatSpeed+s2.userData.phase)*0.5;}\n' +
'  updateShootingStars(dt);\n' +
'  if(!isMobile&&photoSprites.length&&isStarted&&!zoomState){\n' +
'    tmpNdc.x=(lastPtr.x/innerWidth)*2-1;tmpNdc.y=-(lastPtr.y/innerHeight)*2+1;\n' +
'    raycaster.setFromCamera(tmpNdc,camera);\n' +
'    raycaster.params.Sprite={threshold:0.2};\n' +
'    var hits=raycaster.intersectObjects(photoSprites);\n' +
'    hoveredPhoto=hits.length?hits[0].object:null;\n' +
'    for(var k=0;k<photoSprites.length;k++){var s3=photoSprites[k];\n' +
'      var base=s3.userData.baseScale||2;\n' +
'      var tgt=s3===hoveredPhoto?base*1.18:base;\n' +
'      var nxt=s3.scale.x+(tgt-s3.scale.x)*0.15;\n' +
'      s3.scale.set(nxt,nxt,1);}\n' +
'    renderer.domElement.style.cursor=hoveredPhoto?"pointer":"grab";\n' +
'  }\n' +
'  composer.render();\n' +
'}\n' +
'var started=false;\n' +
'function start(){\n' +
'  if(started)return;started=true;\n' +
'  el.start.classList.add("hidden");el.hint.classList.add("show");isStarted=true;\n' +
'  setTimeout(function(){\n' +
'    if(PHOTOS.length){\n' +
'      setTimeout(function(){\n' +
'        var first=PHOTOS[0];\n' +
'        el.modalImg.src=first.url;\n' +
'        var d=(first.desc||"").trim();\n' +
'        if(d){el.modalDesc.textContent=d;el.modalDesc.classList.add("show");}\n' +
'        else{el.modalDesc.textContent="";el.modalDesc.classList.remove("show");}\n' +
'        el.modalMsg.textContent=MESSAGE;\n' +
'        el.modal.classList.add("show");\n' +
'      },900);\n' +
'    }\n' +
'  },1500);\n' +
'}\n' +
'el.startBtn.addEventListener("pointerdown",function(e){\n' +
'  if(e.pointerType==="mouse"&&e.button!==0)return;\n' +
'  e.preventDefault();start();\n' +
'});\n' +
'el.startBtn.addEventListener("click",function(e){e.preventDefault();start();});\n' +
'function closeModal(){el.modal.classList.remove("show");if(isStarted)zoomOutFn();}\n' +
'el.modalClose.addEventListener("click",function(e){e.stopPropagation();closeModal();});\n' +
'el.modal.addEventListener("click",function(e){if(e.target===el.modal)closeModal();});\n' +
'init();\n' +
'})();\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';
}

/* ============================================================
   DESCARGAR
   ============================================================ */
function download(){
  state.name = $("i-name").value.trim() || "Dedicatoria";
  state.subtitle = $("i-sub").value.trim();
  state.message = $("i-msg").value;

  if (state.photos.length === 0){ showStatus("Añade al menos una foto", false); return; }

  showLoading(true);
  try {
    var html = buildGalaxyHTML();
    var sizeKB = (html.length / 1024).toFixed(1);
    console.log("Tamaño del HTML:", sizeKB, "KB");

    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var fname = "galaxia-para-" + slugify(state.name) + ".html";
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);

    showStatus("¡Galaxia descargada! (" + sizeKB + " KB)");

    // Mostrar botón WhatsApp
    $("btn-wa").classList.add("show");
    var waMsg = encodeURIComponent(
      "💫 Te hice una galaxia de amor ✨\n" +
      "Descarga el archivo que te envié y ábrelo para verla."
    );
    $("btn-wa").onclick = function(){
      window.open("https://wa.me/?text=" + waMsg, "_blank");
    };
  } catch(err){
    console.error(err);
    showStatus("Error: " + err.message, false);
  } finally {
    showLoading(false);
  }
}

function initEditor(){
  $("i-photo").addEventListener("change", function(e){ addPhotos(e.target.files); e.target.value = ""; });
  $("btn-generate").addEventListener("click", download);

  var drop = $("file-drop");
  ["dragenter","dragover"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = "#00d4ff"; }); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = ""; }); });
  drop.addEventListener("drop", function(e){ e.preventDefault(); if (e.dataTransfer.files) addPhotos(e.dataTransfer.files); });

  renderPalettes();
  renderPhotoList();
}

initEditor();
</script>
